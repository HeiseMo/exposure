services:
  exposure:
    build: .
    container_name: exposure
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - MAX_EVENTS_PER_GROUP=5000
    volumes:
      - exposure-data:/data
    networks:
      - web

volumes:
  exposure-data:

networks:
  web:
    external: true
