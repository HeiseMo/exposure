<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Profile — Exposure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --bg2: #111118;
      --bg3: #18181f;
      --border: #1e1e2a;
      --border-active: #2e2e42;
      --text: #e2e2f0;
      --text-dim: #888899;
      --text-faint: #44445a;
      --accent: #00e290;
      --accent-dim: rgba(0,226,144,0.7);
      --blue: #6495ed;
      --blue-dim: rgba(100,149,237,0.15);
      --red: #f87171;
      --green: #4ade80;
      --amber: #fbbf24;
      --radius: 10px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.5;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg3);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .back-btn:hover { border-color: var(--border-active); color: var(--text); }

    .topbar-ticker {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .topbar-name {
      font-size: 14px;
      color: var(--text-dim);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Main layout ── */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      margin-bottom: 24px;
    }

    .hero-header { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }

    .ticker-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -1px;
      line-height: 1;
    }

    .hero-meta { flex: 1; min-width: 200px; }
    .company-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 100px;
      border: 1px solid transparent;
    }
    .badge-blue { background: var(--blue-dim); color: var(--blue); border-color: rgba(100,149,237,0.25); }
    .badge-green { background: rgba(0,226,144,0.1); color: var(--accent); border-color: rgba(0,226,144,0.25); }
    .badge-dim { background: var(--bg3); color: var(--text-dim); border-color: var(--border); }

    .hero-info-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .info-item { display: flex; flex-direction: column; gap: 3px; }
    .info-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint); font-weight: 600; }
    .info-value { font-size: 13px; color: var(--text-dim); }
    .info-value a { color: var(--blue); text-decoration: none; }
    .info-value a:hover { text-decoration: underline; }

    /* ── Section ── */
    .section { margin-bottom: 24px; }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* ── Actions bar ── */
    .actions-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .actions-label { font-size: 13px; color: var(--text-dim); flex: 1; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid transparent;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary {
      background: var(--accent);
      color: #0a0a0f;
      border-color: var(--accent);
    }
    .btn-primary:not(:disabled):hover { opacity: 0.85; }
    .btn-secondary {
      background: var(--bg3);
      color: var(--text);
      border-color: var(--border-active);
    }
    .btn-secondary:not(:disabled):hover { border-color: var(--text-dim); }

    /* ── Filings table ── */
    .filings-list { display: flex; flex-direction: column; gap: 6px; }
    .filing-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .filing-form {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 40px;
      text-align: center;
    }
    .form-10k { background: rgba(100,149,237,0.15); color: var(--blue); }
    .form-10q { background: rgba(0,226,144,0.1); color: var(--accent); }
    .form-8k { background: rgba(251,191,36,0.1); color: var(--amber); }
    .filing-date { font-size: 12px; color: var(--text-dim); min-width: 88px; }
    .filing-link {
      font-size: 12px;
      color: var(--blue);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .filing-link:hover { text-decoration: underline; }

    /* ── Reports ── */
    .reports-list { display: flex; flex-direction: column; gap: 16px; }

    .report-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .report-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }
    .report-header:hover { background: var(--bg3); }

    .report-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    .report-meta {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chevron {
      color: var(--text-dim);
      transition: transform 0.2s;
      font-size: 16px;
    }
    .report-card.open .chevron { transform: rotate(180deg); }

    .report-body { display: none; }
    .report-card.open .report-body { display: block; }

    .report-iframe {
      width: 100%;
      border: none;
      display: block;
      min-height: 600px;
      background: #0a0a0f;
    }

    /* ── Enrichment pending ── */
    .pending-notice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      background: rgba(251,191,36,0.06);
      border: 1px solid rgba(251,191,36,0.2);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--amber);
      margin-bottom: 16px;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(251,191,36,0.3);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-faint);
      font-size: 14px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e1e2a;
      color: var(--text);
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 13px;
      border: 1px solid var(--border-active);
      transition: transform 0.25s ease;
      z-index: 999;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .hero { padding: 20px 16px; }
      .main { padding: 16px 12px 60px; }
      .ticker-badge { font-size: 26px; }
      .company-name { font-size: 16px; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-btn">← Back</a>
  <span class="topbar-ticker" id="topTicker">—</span>
  <span class="topbar-name" id="topName"></span>
</div>

<div class="main">

  <!-- Hero -->
  <div class="hero" id="hero">
    <div class="hero-header">
      <div class="ticker-badge" id="heroTicker">—</div>
      <div class="hero-meta">
        <div class="company-name" id="heroName">Loading…</div>
        <div class="badge-row" id="heroBadges"></div>
      </div>
    </div>
    <div class="hero-info-row" id="heroInfoRow"></div>
  </div>

  <!-- Enrichment pending notice -->
  <div class="pending-notice" id="pendingNotice" style="display:none">
    <span class="spinner"></span>
    <span>Fetching SEC EDGAR data for this ticker — refresh in a moment.</span>
  </div>

  <!-- Actions -->
  <div class="actions-bar">
    <span class="actions-label">AI-generated report from SEC filings</span>
    <button class="btn btn-secondary" id="copyPromptBtn" title="Copy the LLM prompt to clipboard">Copy Prompt</button>
    <button class="btn btn-primary" id="generateBtn">Generate Report</button>
  </div>

  <!-- SEC Filings -->
  <div class="section" id="filingsSection" style="display:none">
    <div class="section-title">Recent SEC Filings</div>
    <div class="filings-list" id="filingsList"></div>
  </div>

  <!-- Reports -->
  <div class="section">
    <div class="section-title">AI Reports</div>
    <div class="reports-list" id="reportsList">
      <div class="empty-state">No reports yet. Generate one above.</div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="/company.js"></script>
</body>
</html>
