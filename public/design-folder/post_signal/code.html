<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Exposure - Post Signal</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#b4b5b7",
                        "tertiary-container": "#d0e1fb",
                        "surface-container-high": "#282a2c",
                        "on-primary-fixed-variant": "#005231",
                        "on-error": "#690005",
                        "on-surface": "#e2e2e5",
                        "surface-container-low": "#1a1c1e",
                        "surface-container-highest": "#333537",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-tertiary": "#213145",
                        "secondary-fixed": "#e2e2e5",
                        "error": "#ffb4ab",
                        "on-secondary": "#2f3133",
                        "surface": "#121416",
                        "on-secondary-fixed": "#1a1c1e",
                        "surface-variant": "#333537",
                        "on-tertiary-fixed-variant": "#38485d",
                        "outline": "#849588",
                        "inverse-primary": "#006d43",
                        "surface-bright": "#38393c",
                        "primary-fixed-dim": "#00e290",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "inverse-surface": "#e2e2e5",
                        "secondary": "#c6c6c9",
                        "on-surface-variant": "#b9cbbd",
                        "background": "#121416",
                        "surface-dim": "#121416",
                        "outline-variant": "#3a4a3f",
                        "secondary-fixed-dim": "#c6c6c9",
                        "on-secondary-fixed-variant": "#454749",
                        "on-primary": "#003920",
                        "on-primary-container": "#007146",
                        "error-container": "#93000a",
                        "on-background": "#e2e2e5",
                        "on-primary-fixed": "#002111",
                        "on-error-container": "#ffdad6",
                        "primary": "#f5fff5",
                        "primary-fixed": "#52ffac",
                        "primary-container": "#00ffa3",
                        "surface-tint": "#00e290",
                        "surface-container": "#1e2022",
                        "secondary-container": "#454749",
                        "inverse-on-surface": "#2f3133",
                        "on-tertiary-container": "#54647a",
                        "surface-container-lowest": "#0c0e10",
                        "tertiary-fixed": "#d3e4fe",
                        "tertiary": "#fdfcff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    "fontFamily": {
                        "label-caps": ["Space Grotesk"],
                        "data-mono": ["Space Grotesk"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "1.0", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1rem); }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-5 h-14 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800 text-emerald-400 font-['Space_Grotesk'] tracking-tight text-sm font-bold no-shadows">
<button class="material-symbols-outlined text-zinc-500 hover:bg-zinc-900 transition-colors duration-200 active:opacity-80 transition-all duration-150 p-2 rounded-full">encrypted</button>
<span class="font-mono text-emerald-400 tracking-widest font-black uppercase text-base">EXPOSURE</span>
<button class="material-symbols-outlined text-zinc-500 hover:bg-zinc-900 transition-colors duration-200 active:opacity-80 transition-all duration-150 p-2 rounded-full">sensors</button>
</header>
<!-- Security Status Bar -->
<div class="fixed top-14 left-0 w-full z-40 bg-surface-container border-b border-outline-variant py-2 flex justify-center items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-primary-container text-[14px]">lock</span>
<span class="font-label-caps text-label-caps text-primary-container">AES-256 ACTIVE</span>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[90px] mb-[80px] px-margin-mobile py-stack-md w-full max-w-md mx-auto flex flex-col">
<div class="mb-stack-lg">
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Signal Broadcast</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Transmit verified portfolio adjustments securely.</p>
</div>
<form class="flex flex-col gap-stack-lg flex-1">
<!-- Bento-style Card Container for Form -->
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-5 flex flex-col gap-stack-md">
<!-- Asset Ticker -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-1" for="asset-ticker">
<span class="material-symbols-outlined text-[14px]">key</span>
                        Asset Ticker
                    </label>
<input class="w-full bg-surface border border-outline-variant rounded-lg p-4 font-data-mono text-data-mono text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors uppercase placeholder:normal-case placeholder:text-surface-variant" id="asset-ticker" placeholder="e.g. BTC, ETH, AAPL" type="text"/>
</div>
<!-- Action Toggle -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">swap_vert</span>
                        Action
                    </label>
<div class="grid grid-cols-2 gap-gutter relative bg-surface p-1 rounded-lg border border-outline-variant">
<!-- Simulated Radio Buttons styled as segmented control -->
<label class="cursor-pointer relative z-10">
<input checked="" class="peer sr-only" name="action" type="radio" value="buy"/>
<div class="py-3 text-center rounded font-data-mono text-data-mono text-on-surface-variant peer-checked:text-primary-container peer-checked:bg-surface-container-highest transition-all">
                                BOUGHT
                            </div>
</label>
<label class="cursor-pointer relative z-10">
<input class="peer sr-only" name="action" type="radio" value="sell"/>
<div class="py-3 text-center rounded font-data-mono text-data-mono text-on-surface-variant peer-checked:text-primary-container peer-checked:bg-surface-container-highest transition-all">
                                SOLD
                            </div>
</label>
</div>
</div>
<!-- Numerics Grid -->
<div class="grid grid-cols-2 gap-gutter">
<!-- Percentage -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-1" for="percentage">
<span class="material-symbols-outlined text-[14px]">percent</span>
                            Delta
                        </label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded-lg p-4 pl-8 font-data-mono text-data-mono text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="percentage" placeholder="0.00" step="0.01" type="number"/>
<span class="absolute left-3 top-1/2 -translate-y-1/2 font-data-mono text-data-mono text-on-surface-variant">%</span>
</div>
</div>
<!-- New Total -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-1" for="new-total">
<span class="material-symbols-outlined text-[14px]">pie_chart</span>
                            New Total
                        </label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded-lg p-4 pr-8 font-data-mono text-data-mono text-on-surface text-right focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="new-total" placeholder="0.00" step="0.01" type="number"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-data-mono text-data-mono text-on-surface-variant">%</span>
</div>
</div>
</div>
</div>
<!-- Spacer to push button to bottom if screen is tall enough -->
<div class="flex-1"></div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-4 px-6 rounded-xl font-data-mono text-data-mono flex justify-center items-center gap-2 hover:bg-primary-container transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">enhanced_encryption</span>
                ENCRYPT &amp; POST SIGNAL
            </button>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-16 pb-safe bg-zinc-950/90 backdrop-blur-xl border-t border-zinc-800 font-['Space_Grotesk'] text-[10px] uppercase font-semibold tracking-wider no-shadows">
<a class="flex flex-col items-center justify-center text-zinc-500 pt-1.5 hover:text-emerald-300 transition-colors active:scale-95 duration-100 ease-in-out w-1/3" href="#">
<span class="material-symbols-outlined mb-1">dynamic_feed</span>
<span>Activity</span>
</a>
<a class="flex flex-col items-center justify-center text-emerald-400 border-t-2 border-emerald-400 pt-1 hover:text-emerald-300 transition-colors active:scale-95 duration-100 ease-in-out w-1/3" href="#">
<span class="material-symbols-outlined mb-1">add_box</span>
<span>Signal</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-500 pt-1.5 hover:text-emerald-300 transition-colors active:scale-95 duration-100 ease-in-out w-1/3" href="#">
<span class="material-symbols-outlined mb-1">tune</span>
<span>Settings</span>
</a>
</nav>
</body></html>
